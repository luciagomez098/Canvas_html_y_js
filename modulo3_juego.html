<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo 3: Juego con Colisiones</title>
<style>
body { text-align: center; background: #f4f4f4; font-family: Arial; }
canvas { border: 2px solid #000; background: #fff; margin-top: 20px; }
</style>
</head>
<body onload="iniciarJuego();">
<h1>Módulo 3: Juego 2D con Colisiones</h1>
<canvas id="miCanvas" width="500" height="400"></canvas>
<script>
const canvas = document.getElementById("miCanvas");
const ctx = canvas.getContext("2d");

const brickRowCount = 3, brickColumnCount = 5;
const brickWidth = 70, brickHeight = 20;
const brickPadding = 10, brickOffsetTop = 10, brickOffsetLeft = 10;
let bricks = [];

for (let c = 0; c < brickColumnCount; c++) {
  bricks[c] = [];
  for (let r = 0; r < brickRowCount; r++) {
    bricks[c][r] = { x: 0, y: 0, status: 1 };
  }
}

let ballX = canvas.width / 2, ballY = 50, ballDX = 2, ballDY = 2;
const ballRadius = 8;

function drawBricks() {
  for (let c = 0; c < brickColumnCount; c++) {
    for (let r = 0; r < brickRowCount; r++) {
      if (bricks[c][r].status == 1) {
        let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
        let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
        bricks[c][r].x = brickX;
        bricks[c][r].y = brickY;
        ctx.fillStyle = "blue";
        ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
      }
    }
  }
}

function collisionDetection() {
  for (let c = 0; c < brickColumnCount; c++) {
    for (let r = 0; r < brickRowCount; r++) {
      let b = bricks[c][r];
      if (b.status == 1) {
        if (ballX > b.x && ballX < b.x + brickWidth && ballY > b.y && ballY < b.y + brickHeight) {
          ballDY = -ballDY;
          b.status = 0;
        }
      }
    }
  }
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
  ctx.fillStyle = "orange";
  ctx.fill();
  ctx.closePath();
}

function animateGame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBricks();
  drawBall();
  collisionDetection();

  if (ballX + ballDX > canvas.width - ballRadius || ballX + ballDX < ballRadius) ballDX = -ballDX;
  if (ballY + ballDY < ballRadius || ballY + ballDY > canvas.height - ballRadius) ballDY = -ballDY;

  ballX += ballDX; ballY += ballDY;

  requestAnimationFrame(animateGame);
}

function iniciarJuego() {
  animateGame();
}
</script>
</body>
</html>
